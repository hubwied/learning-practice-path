<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Kalkulator">
      <h1 class="title">Kalkulator</h1>
      <ol class="history" id="history" hidden></ol>
      <div class="display" aria-live="polite">
        <div class="status">
          <span class="memory-flag" id="memory-flag" hidden>M</span>
          <p class="expression" id="expression"></p>
        </div>
        <p class="value" id="display">0</p>
      </div>

      <div class="memory-keys" role="group" aria-label="Pamięć i ostatni wynik">
        <button type="button" data-action="ans" class="key key-fn key-memory">ANS</button>
        <button type="button" data-action="memory-add" class="key key-fn key-memory">M+</button>
        <button type="button" data-action="memory-subtract" class="key key-fn key-memory">M-</button>
        <button type="button" data-action="memory-recall" class="key key-fn key-memory">MR</button>
        <button type="button" data-action="memory-clear" class="key key-fn key-memory">MC</button>
      </div>

      <div class="keys" role="group" aria-label="Przyciski kalkulatora">
        <button type="button" data-action="clear" class="key key-fn">C</button>
        <button type="button" data-action="sign" class="key key-fn">±</button>
        <button type="button" data-action="percent" class="key key-fn">%</button>
        <button type="button" data-operator="/" class="key key-op">÷</button>

        <button type="button" data-digit="7" class="key">7</button>
        <button type="button" data-digit="8" class="key">8</button>
        <button type="button" data-digit="9" class="key">9</button>
        <button type="button" data-operator="*" class="key key-op">×</button>

        <button type="button" data-digit="4" class="key">4</button>
        <button type="button" data-digit="5" class="key">5</button>
        <button type="button" data-digit="6" class="key">6</button>
        <button type="button" data-operator="-" class="key key-op">−</button>

        <button type="button" data-digit="1" class="key">1</button>
        <button type="button" data-digit="2" class="key">2</button>
        <button type="button" data-digit="3" class="key">3</button>
        <button type="button" data-operator="+" class="key key-op">+</button>

        <button type="button" data-digit="0" class="key key-zero">0</button>
        <button type="button" data-action="decimal" class="key">,</button>
        <button type="button" data-action="equals" class="key key-eq">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
